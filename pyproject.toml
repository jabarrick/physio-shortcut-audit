[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p3audit"
version = "1.0.0"
description = "Semi-synthetic ground-truth test of physiological shortcut audits for EEG decoders"
authors = [{ name = "Yu Gao" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "mne>=1.6",
    "torch>=2.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
spectral = ["specparam>=2.0"]
foundation = ["timm>=1.0", "einops>=0.7"]   # needed by the official LaBraM repository
figures = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/jabarrick/physio-shortcut-audit"
Preregistration = "https://doi.org/10.17605/OSF.IO/8Q7N6"

[project.scripts]
p3audit = "p3audit.cli:main"

[tool.setuptools.packages.find]
include = ["p3audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
